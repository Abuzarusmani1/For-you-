<!DOCTYPE html>
<html>
<head>
  <title>For You ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: linear-gradient(135deg, #ff5f6d, #ffc371);
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: rgba(255,255,255,0.2);
      padding: 25px;
      border-radius: 20px;
      width: 90%;
      max-width: 350px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
    }
    .yes {
      background: white;
      color: #ff4b7d;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Hey Mansuu Baby 😘❤️</h1>
  <p>
    Jab se tum meri life me aayi ho,<br>
    sab kuch thoda aur beautiful lagne laga hai.<br><br>
    Will you be my Valentine? 💌
  </p>

  <button class="yes" onclick="alert('Yayyy ❤️')">Yes 💖</button>
</div>

</body>
</html>
