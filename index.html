<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  font-family: 'Poppins', sans-serif;
}
.envelope{
  width:280px;
  height:180px;
  background:#fff;
  border-radius:15px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  box-shadow:0 20px 40px rgba(0,0,0,0.2);
  animation:float 2s infinite ease-in-out;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}
.card{
  display:none;
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(10px);
  padding:30px;
  border-radius:25px;
  text-align:center;
  color:#fff;
  box-shadow:0 30px 60px rgba(0,0,0,0.25);
  max-width:320px;
}
button{
  border:none;
  padding:12px 25px;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
  background:#fff;
  color:#ff4d6d;
  margin-top:20px;
}
.hearts{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
  overflow:hidden;
}
.heart{
  position:absolute;
  color:red;
  font-size:20px;
  animation:fall 4s linear infinite;
}
@keyframes fall{
  0%{transform:translateY(-10%)}
  100%{transform:translateY(110%)}
}
</style>
</head>
<body>

<div class="envelope" onclick="openCard()">
  💌 Tap to Open
</div>

<div class="card" id="card">
  <h2>Hey Mansuu Baby 😘</h2>
  <p>
    Jab se tum meri life me aayi ho,<br>
    sab kuch aur bhi beautiful lagne laga hai 💖
  </p>
  <h3>Will you be my Valentine? 💌</h3>
  <button onclick="yesClicked()">Yes 💕</button>
</div>

<div class="hearts" id="hearts"></div>

<script>
function openCard(){
  document.querySelector('.envelope').style.display='none';
  document.getElementById('card').style.display='block';
}
function yesClicked(){
  document.getElementById('card').innerHTML =
  "<h2>Yayyy! 🥹💖</h2><p>You just made my day Mansuu Baby 😘<br>Forever grateful ❤️</p>";
  for(let i=0;i<25;i++){
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"%";
    h.style.fontSize=(15+Math.random()*20)+"px";
    h.style.animationDuration=(3+Math.random()*3)+"s";
    document.getElementById("hearts").appendChild(h);
  }
}
</script>

</body>
</html>
